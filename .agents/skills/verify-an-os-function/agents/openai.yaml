interface:
  display_name: "验证 OS 函数"
  short_description: "分阶段设计并验证 CRTOS 函数的 predicate、spec 与 proof"
  default_prompt: "使用 $verify-an-os-function 读取真实 CRTOS C 与配置，分别审阅 predicate 和 spec；我批准两份 revision 后，调用 QCP verification-orchestrator 完成 implement。"

dependencies:
  tools:
    - type: "mcp"
      value: "qcp"
      description: "对 annotated C 进行符号执行、诊断并导出证明目标"
    - type: "mcp"
      value: "rocq-mcp"
      description: "编译、交互证明并验证 Rocq lemma 与 QCP VC"
