interface:
  display_name: "QCP C 函数验证"
  short_description: "通用 C predicate、spec、VC 与 Rocq 证明流程"
  default_prompt: "使用 $verify-c-function-with-qcp 确认目标 C 与配置，设计并分开审阅 predicate/spec，待我批准 revisions 后完成 QCP symbolic、VC 和 Rocq proof。"

dependencies:
  tools:
    - type: "mcp"
      value: "qcp"
      description: "对 annotated C 进行符号执行、诊断并导出证明目标"
    - type: "mcp"
      value: "rocq-mcp"
      description: "编译、交互证明并验证 Rocq lemma 与 QCP VC"
